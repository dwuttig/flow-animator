services:
  viewer:
    build:
      context: .
      target: viewer
    image: flow-animator:latest
    ports:
      - "8080:8080"
    volumes:
      # Your own flows, served at http://localhost:8080/flows/<name>.flow.json
      - ./flows:/usr/share/nginx/html/flows
    restart: unless-stopped

  # MCP server: lets agents create/edit flows in the same ./flows folder.
  # Endpoint: http://localhost:8081/mcp  (Streamable HTTP, POST only)
  # Also serves the Flow API, reached by the viewer at http://localhost:8080/api/flows
  mcp:
    build:
      context: .
      target: mcp
    image: flow-animator-mcp:latest
    ports:
      # Bound to localhost only; the server edits files, so don't expose it without a token.
      - "127.0.0.1:8081:8081"
    environment:
      # Set a token to require "Authorization: Bearer <token>".
      MCP_TOKEN: ${MCP_TOKEN:-}
    volumes:
      - ./flows:/flows
    restart: unless-stopped
