server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate so edited flow files show up immediately.
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Directory listing of flows as JSON, handy for pickers and the future MCP server.
  location /flows/ { autoindex on; autoindex_format json; }

  # Flow API (stored flows: list, load, save). Served by the mcp container.
  # The upstream is resolved per request, so this image still starts without it;
  # /api/ then answers 502 and the viewer falls back to read-only.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $flow_api http://mcp:8081;
    proxy_pass $flow_api;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
  }

  location / { try_files $uri $uri/index.html =404; }
}
