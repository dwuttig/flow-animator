server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate so edited flow files show up immediately.
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # Directory listing of flows as JSON, handy for pickers and the future MCP server.
  location /flows/ { autoindex on; autoindex_format json; }

  location / { try_files $uri $uri/index.html =404; }
}
