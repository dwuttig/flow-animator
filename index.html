<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow animator</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light dark;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--r-ctl:8px;--r-box:12px;--ctl-h:30px;--fs-sm:12px;--fs:13px;--bg:#fff;--text:#1f1e1d;--text2:#5f5e5a;--line:rgba(0,0,0,.14);--card:#f5f4ef;--edge:#8a8982;--sel:#2B7BD6;--hot:#EF9F27;--hot-d:#854F0B;--done:#BA7517;--bad:#A32D2D;--bad-bg:#FCEBEB;--warn:#633806;--warn-bg:#FAEEDA}
@media (prefers-color-scheme:dark){:root{--sel:#6FB1F5;--bg:#1f1e1d;--text:#eeece6;--text2:#b4b2a9;--line:rgba(255,255,255,.18);--card:#2a2927;--edge:#888780;--bad:#F7C1C1;--bad-bg:#501313;--warn:#FAC775;--warn-bg:#412402}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{font-size:22px;font-weight:500;margin:0}
#desc{margin:4px 0 0;color:var(--text2);max-width:70ch}
#src{margin:4px 0 0;font-size:12px;color:var(--text2)}
button,select,input[type=text]{font:inherit;font-size:var(--fs);color:var(--text);height:var(--ctl-h);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 var(--sp-3)}
button{background:transparent;cursor:pointer;white-space:nowrap}
select,input[type=text]{background:var(--card);padding:0 var(--sp-2)}
input[type=range]{accent-color:var(--hot);margin:0;height:var(--ctl-h)}
input[type=checkbox]{margin:0}
button:hover{background:var(--card)}
button:focus-visible,input:focus-visible,li[tabindex]:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
#issues{margin:16px 0 0;border-radius:8px;padding:10px 14px;font-size:13px}
#issues.bad{background:var(--bad-bg);color:var(--bad)}
#issues.warn{background:var(--warn-bg);color:var(--warn)}
#issues .ihead{font-weight:500}
#issues ul{margin:6px 0 0;padding-left:18px}
#issues code{font:12px ui-monospace,Menlo,Consolas,monospace;margin-right:6px}
#stage{margin:20px 0 4px;text-align:center;overflow-x:auto}
#svg{max-width:none;height:auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.edge{fill:none;stroke:var(--edge);stroke-width:var(--ew,1.5);transition:stroke .2s}
#svg.ss-solid .edge{stroke-dasharray:none}
#svg.ss-dashed .edge{stroke-dasharray:6 4}
#svg.ss-dotted .edge{stroke-dasharray:2 4;stroke-linecap:round}
#stagewrap{display:flex;gap:var(--sp-4);align-items:flex-start;margin:20px 0 4px}
#stagewrap #stage{margin:0;flex:1 1 0;min-width:0}
#vizbar{flex:none;width:272px;padding:var(--sp-3);border:1px solid var(--line);border-radius:var(--r-box);background:var(--card);font-size:var(--fs);color:var(--text2)}
#vphead{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);font-weight:600;color:var(--text)}
#vphead button{height:26px;padding:0 var(--sp-2);font-size:var(--fs-sm);font-weight:400}
#vpbody{display:flex;flex-direction:column;gap:var(--sp-3);margin-top:var(--sp-3)}
#vizbar.collapsed{width:auto;padding:var(--sp-2) var(--sp-3)}
#vizbar.collapsed #vpbody{display:none}
.vpsec{display:flex;flex-direction:column;gap:var(--sp-2);padding-top:var(--sp-3);border-top:1px solid var(--line)}
.vpsec>h3{margin:0;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--text2)}
.vpbtns{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:var(--sp-2)}
.vpbtns button{padding:0 var(--sp-1)}
.vpline{display:flex;align-items:center;gap:var(--sp-2)}
.vpline>input[type=range]{flex:1 1 0;min-width:0}
.vpline output{min-width:3.5em;text-align:right;white-space:nowrap}
.vpfield{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:var(--sp-2)}
.vpfield select{grid-column:2/4;width:100%}
.vpfield input[type=range]{width:100%}
.vpfield output{min-width:2.5em;text-align:right}
.vphint{font-size:var(--fs-sm);color:var(--text2)}
body.ctrl #svg{cursor:grab}
.vpchecks{display:flex;gap:var(--sp-4);flex-wrap:wrap}
.vpchecks label{display:inline-flex;align-items:center;gap:var(--sp-2)}
@media (max-width:760px){#stagewrap{flex-direction:column}#vizbar{width:100%}}
@media (max-width:1399px){body.editing #stagewrap{flex-direction:column}body.editing #vizbar{width:100%}}
@media (max-width:760px),(max-width:1399px){
  body.editing #vpbody,#vpbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--sp-4)}
}
#viewer:fullscreen #stagewrap,#viewer.maxed #stagewrap{flex:1 1 auto;min-height:0;display:flex;margin:0}
#viewer:fullscreen #stagewrap #stage,#viewer.maxed #stagewrap #stage{flex:1 1 0;align-self:stretch}
#viewer:fullscreen #vizbar,#viewer.maxed #vizbar{align-self:stretch;overflow-y:auto}
.k-response{stroke-dasharray:6 4}
.k-async,.k-event{stroke-dasharray:2 4;stroke-linecap:round}
.edge.done{stroke:var(--done);opacity:.75}
.edge.active{stroke:var(--hot);stroke-width:calc(var(--ew,1.5) * 1.8);opacity:1}
.body{fill:var(--fill);stroke:var(--stroke);stroke-width:.75;transition:stroke .2s}
.lip{fill:none;stroke:var(--stroke);stroke-width:.75}
.node.hl .body{stroke:var(--hot);stroke-width:2.5}
.node.sel .body{stroke:var(--sel);stroke-width:3.5}
.node.glow .body{animation:glow 1.1s ease-in-out infinite}
.edge.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px var(--sel))}50%{filter:drop-shadow(0 0 9px var(--sel)) drop-shadow(0 0 4px var(--sel))}}
.edge.sel{stroke:var(--sel);stroke-width:3.5;opacity:1}
.lbl{fill:var(--title);font-size:14px;font-weight:500}
.sub{fill:var(--sub);font-size:12px}
.slbl text{fill:var(--text2);font-size:11px;font-weight:400;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:central}
.slbl.active text{fill:var(--text);font-weight:600;font-size:12px}
#svg.nolabels .slbl{display:none}
.pkt{fill:var(--hot);stroke:var(--hot-d);stroke-width:1}
.pkt.resp{fill:var(--bg)}
#legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text2);min-height:8px}
#legend .chip{display:inline-flex;align-items:center;gap:6px}
#legend i{width:12px;height:12px;border-radius:3px;background:var(--fill);border:1px solid var(--stroke)}
#cap{margin:12px 0 0;width:100%;background:var(--card);border-radius:var(--r-box);padding:12px 16px;height:160px;overflow-y:auto}
#cap .line+.line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#cap .t{font-weight:500}
#cap .route{color:var(--text2);font-size:13px;margin-left:6px}
#cap .d{color:var(--text2);margin-top:2px}
#cap code{display:inline-block;margin-top:4px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
#steps{list-style:none;counter-reset:s;margin:14px 0 0;padding:0;width:100%}
#steps li{counter-increment:s;display:flex;gap:10px;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);border-left:3px solid transparent}
#steps li::before{content:counter(s);min-width:18px;text-align:right;color:var(--text2)}
#steps li.par::before{content:"+"}
#steps li:hover{background:var(--card)}
#steps li.past{color:var(--text)}
#steps li.active{background:var(--card);color:var(--text);border-left-color:var(--hot);font-weight:500}
#drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:20px;z-index:10}
#drop[hidden]{display:none}
dialog{width:min(640px,92vw);border:1px solid var(--line);border-radius:var(--r-box);background:var(--bg);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;height:260px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.askdlg{width:min(440px,92vw)}
.askmsg{margin:0 0 10px;white-space:pre-wrap}
.askin{width:100%;height:var(--ctl-h);font:inherit;font-size:var(--fs);color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 var(--sp-2)}
.askok{border-color:var(--hot)}
#layout{display:block}
#editor{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow:auto;font-size:13px}
#editor[hidden]{display:none}
#viewer{min-width:0}
#viewer:fullscreen,#viewer.maxed{background:var(--bg);display:flex;flex-direction:column;padding:16px 24px;overflow:auto}
#viewer.maxed{position:fixed;inset:0;z-index:5}
body.maxed{overflow:hidden}
#viewer:fullscreen #stage,#viewer.maxed #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:safe center;margin:0}
#viewer:fullscreen #svg,#viewer.maxed #svg{flex:none}
#viewer:fullscreen #steps,#viewer.maxed #steps{display:none}
#viewer:fullscreen #cap,#viewer.maxed #cap{width:100%;flex:none}
@media (min-width:960px){
  body.editing #layout{display:grid;grid-template-columns:minmax(420px,560px) minmax(0,1fr);gap:24px;align-items:start}
  body.editing #editor{position:sticky;top:12px;max-height:calc(100vh - 24px)}
}
@media (max-width:959px){#editor{max-height:50vh}}
.ebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:1}
.edirty{color:var(--warn);font-size:12px}
.esec{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.esec summary{cursor:pointer;font-weight:600;font-size:14px;margin:0;padding:8px 10px;background:var(--card);display:flex;align-items:center;gap:8px}
.esec[open]>summary{border-bottom:1px solid var(--line)}
.esec summary .ecount{font-size:11px;font-weight:500;color:var(--text2);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.esec>.ebody{padding:0 10px 10px}
.ebody{display:flex;flex-direction:column;width:100%}
.eitem{border-top:1px solid var(--line)}
.eitem>summary{cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eitem>.erow{border-top:0;padding:2px 10px 10px}
.eitem>summary:hover{background:var(--card)}
.eitem[open]>summary{font-weight:600}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.esec>summary::after,.eitem>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:rotate(45deg);flex:none;transition:transform .15s}
.esec>summary::after{margin-left:auto;margin-bottom:3px}
.eitem>summary{position:relative;padding-right:30px}
.eitem>summary::after{position:absolute;right:12px;top:calc(50% - 6px)}
.esec[open]>summary::after,.eitem[open]>summary::after{transform:rotate(-135deg)}
.esec[open]>summary::after{margin-bottom:-3px}
.eitem[open]>summary::after{top:calc(50% - 2px)}
.erow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px 8px;align-items:end;padding:8px 0;border-top:1px solid var(--line);width:100%}
.erow>.ef{grid-column:span 4}
.erow>button{grid-column:span 2;justify-self:stretch;padding:0 6px}
.erow>.eid{grid-column:span 4;align-self:center;overflow:hidden;text-overflow:ellipsis;font:12px ui-monospace,Menlo,Consolas,monospace}
.emodes{display:flex;gap:0;margin:8px 0 2px}
.emodes button{border-radius:0;padding:0 12px;font-size:var(--fs-sm)}
.emodes button:first-child{border-radius:8px 0 0 8px}
.emodes button:last-child{border-radius:0 8px 8px 0;border-left:0}
.emodes button[aria-pressed=true]{background:var(--card);border-color:var(--hot);font-weight:600}
.esentence{grid-column:span 11;align-self:center;font-size:13px;line-height:2;color:var(--text)}
.elink{font:inherit;color:var(--sel);background:transparent;border:0;border-bottom:1px solid currentColor;border-radius:0;padding:0 1px;cursor:pointer}
.elink:hover{background:var(--card)}
.elink.empty{color:var(--text2);font-style:italic}
.elinkin{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--sel);border-radius:4px;padding:1px 4px;max-width:100%}
.eadd{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.eaddbtn{width:100%;border:1px dashed var(--text2);border-radius:var(--r-ctl);background:transparent;color:var(--text);cursor:pointer;font-weight:500}
.eaddbtn:hover:not(:disabled){background:var(--card)}
.eaddbtn:disabled{opacity:.5;cursor:default}
.ef{display:flex;flex-direction:column;font-size:11px;color:var(--text2);min-width:0}
.ef input[type=text],.ef select{width:100%;min-width:0;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 var(--sp-2);height:var(--ctl-h)}
.ef.echk{flex-direction:row;align-items:center;gap:6px;height:var(--ctl-h)}
.enum{padding:0}
#editBtn[aria-pressed=true]{background:var(--card);border-color:var(--hot)}
#note{margin:2px 0 0;font-size:12px;color:var(--text2);min-height:1em}
.menu{position:relative;display:inline-block}
.menupop{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:260px;max-width:340px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.menupop[hidden]{display:none}
.menupop button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menupop button:disabled{opacity:.45;cursor:not-allowed}
.menupop button.cur{background:var(--card);box-shadow:inset 3px 0 var(--hot)}
.menupop .mh{font-size:11px;color:var(--text2);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.menupop .ms{height:1px;background:var(--line);margin:6px 0}
.menupop .ml{max-height:180px;overflow-y:auto}
#mcpDlg{max-width:640px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:0}
#mcpDlg::backdrop{background:rgba(0,0,0,.4)}
.mcpbox{padding:16px 20px}
.mcpbox h2{margin:0 0 4px;font-size:18px;font-weight:500}
.mcpbox p{margin:4px 0 10px;color:var(--text2);font-size:13px}
.mcptabs{display:flex;gap:6px;margin-bottom:10px}
.mcptabs button[aria-pressed=true]{background:var(--card);border-color:var(--hot)}
.mcprow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2);margin-bottom:8px}
.mcprow input{flex:1;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.mcphead{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.mcpbox pre{margin:4px 0 8px;padding:10px;background:var(--card);border-radius:8px;font:12px ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.edge,.body{transition:none}.node.glow .body,.edge.glow{animation:none;filter:drop-shadow(0 0 6px var(--sel))}}
</style>
<style id="pal"></style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="title">Flow animator</h1>
      <p id="desc"></p>
      <p id="src"></p>
      <p id="note" role="status" aria-live="polite"></p>
    </div>
    <div class="tools">
      <span id="menuHost"></span>
      <button id="editBtn" type="button" aria-pressed="false">Edit</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section id="issues" hidden aria-live="polite"></section>

  <div id="layout">
    <section id="editor" hidden aria-label="Editor"></section>
    <div id="viewer">
    <div id="stagewrap">
      <section id="stage"><svg id="svg" role="img" aria-label="Animated flow diagram"></svg></section>
      <aside id="vizbar" aria-label="View panel">
        <div id="vphead"><span>View</span><button id="vpToggle" type="button" aria-expanded="true" title="Hide or show the view panel">Hide</button></div>
        <div id="vpbody">
          <div class="vpsec">
            <h3>Playback</h3>
            <div class="vpbtns">
              <button id="restart" type="button">Restart</button>
              <button id="prev" type="button">Prev</button>
              <button id="play" type="button">Pause</button>
              <button id="next" type="button">Next</button>
            </div>
            <div class="vpline"><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step"><output id="count">1 / 1</output></div>
            <div class="vpfield"><label for="spd">Speed</label><input id="spd" type="range" min="0.5" max="3" step="0.5" value="1"><output id="spdl">1x</output></div>
            <div class="vpchecks">
              <label><input id="loop" type="checkbox" checked> Loop</label>
              <label><input id="trail" type="checkbox" checked> Trail</label>
            </div>
          </div>
          <div class="vpsec">
            <h3>Display</h3>
            <div class="vpfield"><label for="optDir">Orientation</label><select id="optDir"><option value="LR">Horizontal</option><option value="TB">Vertical</option></select></div>
            <div class="vpfield"><label for="optConn">Connections</label><select id="optConn"><option value="auto">Auto</option><option value="bezier">Bezier</option><option value="linear">Linear</option><option value="orthogonal">Orthogonal</option></select></div>
            <div class="vpfield"><label for="optStep">Step style</label><select id="optStep"><option value="kind">By kind</option><option value="solid">Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select></div>
            <div class="vpchecks"><label><input id="optLabels" type="checkbox" checked> Labels</label><label title="Reorder nodes and place step labels to reduce overlaps and crossings"><input id="optOpt" type="checkbox"> Optimize layout</label></div>
            <div class="vpfield"><label for="optSpace">Node spacing</label><input id="optSpace" type="range" min="0.5" max="3" step="0.1" value="1"><output id="optSpaceL">1.0x</output></div>
            <div class="vpfield"><label for="optThick">Thickness</label><input id="optThick" type="range" min="1" max="6" step="0.5" value="1.5"><output id="optThickL">1.5</output></div>
          </div>
          <div class="vpsec">
            <h3>Zoom and view</h3>
            <div class="vpbtns" style="--cols:3">
              <button id="zin" type="button" title="Zoom in" aria-label="Zoom in">+</button>
              <button id="zout" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
              <button id="zreset" type="button" title="Reset zoom and position">Reset</button>
            </div>
            <div class="vphint">Ctrl + wheel: zoom. Ctrl + drag: pan. Double-click: reset.</div>
            <div class="vpbtns" style="--cols:2">
              <button id="maxBtn" type="button" aria-pressed="false" title="Maximize the visualization (M)">Maximize</button>
              <button id="fsBtn" type="button" aria-pressed="false" title="Fullscreen (F)">Fullscreen</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
    <div id="legend"></div>

    <section id="cap" aria-live="polite"></section>

    <ol id="steps"></ol>
    </div>
  </div>
</div>

<div id="drop" hidden>Drop a .flow.json file to animate it</div>

<dialog id="dlg">
  <form method="dialog">
    <label for="ta" class="sr">Flow JSON</label>
    <textarea id="ta" spellcheck="false" placeholder='{ "format": "flow-animator/1", "nodes": [ ... ], "steps": [ ... ] }'></textarea>
    <div class="row">
      <button value="cancel">Cancel</button>
      <button id="renderBtn" value="ok">Render</button>
    </div>
  </form>
</dialog>

<noscript>This tool needs JavaScript.</noscript>

<script src="src/flow-modeling/flow-modeling.js"></script>
<script src="src/layout/layout.js"></script>
<script src="flow-core.js"></script>
<script src="src/flow-library/flow-name/flow-name.js"></script>
<script src="src/flow-library/apply-edit/apply-edit.js"></script>
<script src="src/playback/dialogs/dialogs.js"></script>
<script src="src/playback/play-flow/play-flow.js"></script>
<script src="src/playback/render-diagram/render-diagram.js"></script>
<script src="src/playback/view-options/view-options.js"></script>
<script src="src/playback/edit-flow/edit-flow.js"></script>
<script src="src/playback/flow-gateway/flow-gateway.js"></script>
<script src="src/playback/save-flow/save-flow.js"></script>
<script src="src/playback/mcp-config/mcp-config.js"></script>
<script src="src/playback/export-flow/export-flow.js"></script>
<script src="src/playback/record-video/record-video.js"></script>

<script id="sample-flow" type="application/json">{
  "$schema": "../flow.schema.json",
  "format": "flow-animator/1",
  "title": "Order submission",
  "description": "A client submits an order. The service stores it and hands the slow work to a background worker.",
  "groups": [
    { "id": "client", "label": "Client", "color": "gray" },
    { "id": "sync", "label": "Request path", "color": "purple" },
    { "id": "async", "label": "Background processing", "color": "teal" },
    { "id": "external", "label": "External", "color": "coral" }
  ],
  "nodes": [
    { "id": "client", "label": "Client", "subtitle": "WPF app", "group": "client" },
    { "id": "api", "label": "API gateway", "subtitle": "Auth, routing", "group": "sync" },
    { "id": "orders", "label": "Order service", "subtitle": "Business logic", "group": "sync" },
    { "id": "db", "label": "Database", "subtitle": "Orders table", "shape": "database", "group": "client", "col": 3, "row": 0 },
    { "id": "queue", "label": "Message queue", "subtitle": "OrderCreated events", "shape": "queue", "group": "async", "col": 3, "row": 1 },
    { "id": "worker", "label": "Worker", "subtitle": "Background jobs", "group": "async", "col": 4, "row": 1 },
    { "id": "mail", "label": "Email provider", "subtitle": "SMTP relay", "group": "external", "col": 4, "row": 0 }
  ],
  "steps": [
    { "from": "client", "to": "api", "label": "Submit order", "detail": "The user presses Submit; the client sends the order over HTTPS.", "payload": "POST /orders" },
    { "from": "api", "to": "orders", "label": "Forward request", "detail": "The gateway validates the token and routes the call to the order service." },
    { "from": "orders", "to": "db", "label": "Persist order", "detail": "The order is saved with status 'received'.", "payload": "INSERT INTO orders" },
    { "from": "orders", "to": "queue", "label": "Publish event", "kind": "async", "detail": "Slow work is deferred: an OrderCreated event is queued.", "payload": "OrderCreated { id }" },
    { "from": "orders", "to": "api", "label": "Return result", "kind": "response", "detail": "The service answers without waiting for the worker.", "payload": "201 Created" },
    { "from": "api", "to": "client", "label": "Confirm to user", "kind": "response", "detail": "The client shows the confirmation." },
    { "from": "queue", "to": "worker", "label": "Deliver event", "kind": "async", "detail": "The worker picks up the event from the queue." },
    { "from": "worker", "to": "db", "label": "Update status", "detail": "Status changes to 'processing'.", "payload": "UPDATE orders" },
    { "from": "worker", "to": "mail", "label": "Send confirmation email", "kind": "async", "together": true, "detail": "Runs in parallel with the status update." }
  ]
}</script>
<script src="src/playback/viewer/viewer.js"></script>
</body>
</html>
