<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow animator</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light dark;--bg:#fff;--text:#1f1e1d;--text2:#5f5e5a;--line:rgba(0,0,0,.14);--card:#f5f4ef;--edge:#8a8982;--sel:#2B7BD6;--hot:#EF9F27;--hot-d:#854F0B;--done:#BA7517;--bad:#A32D2D;--bad-bg:#FCEBEB;--warn:#633806;--warn-bg:#FAEEDA}
@media (prefers-color-scheme:dark){:root{--sel:#6FB1F5;--bg:#1f1e1d;--text:#eeece6;--text2:#b4b2a9;--line:rgba(255,255,255,.18);--card:#2a2927;--edge:#888780;--bad:#F7C1C1;--bad-bg:#501313;--warn:#FAC775;--warn-bg:#412402}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:1440px;margin:0 auto;padding:20px 24px 40px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{font-size:22px;font-weight:500;margin:0}
#desc{margin:4px 0 0;color:var(--text2);max-width:70ch}
#src{margin:4px 0 0;font-size:12px;color:var(--text2)}
button{font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--card)}
button:focus-visible,input:focus-visible,li[tabindex]:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
#issues{margin:16px 0 0;border-radius:8px;padding:10px 14px;font-size:13px}
#issues.bad{background:var(--bad-bg);color:var(--bad)}
#issues.warn{background:var(--warn-bg);color:var(--warn)}
#issues .ihead{font-weight:500}
#issues ul{margin:6px 0 0;padding-left:18px}
#issues code{font:12px ui-monospace,Menlo,Consolas,monospace;margin-right:6px}
#stage{margin:20px 0 4px;text-align:center;overflow-x:auto}
#svg{max-width:none;height:auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.edge{fill:none;stroke:var(--edge);stroke-width:var(--ew,1.5);transition:stroke .2s}
#svg.ss-solid .edge{stroke-dasharray:none}
#svg.ss-dashed .edge{stroke-dasharray:6 4}
#svg.ss-dotted .edge{stroke-dasharray:2 4;stroke-linecap:round}
#stagewrap{position:relative;margin:20px 0 4px}
#stagewrap #stage{margin:0}
#vizbar{position:absolute;top:8px;right:8px;z-index:3;width:max-content;max-width:min(340px,calc(100% - 16px));padding:6px 8px;border-radius:10px;font-size:13px;color:var(--text2);background:color-mix(in srgb,var(--bg) 88%,transparent);border:1px solid var(--line);backdrop-filter:blur(4px)}
#vphead{display:flex;justify-content:space-between;align-items:center;gap:10px}
#vpbody{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#vizbar.collapsed #vpbody{display:none}
#vizbar.collapsed #vphead{margin:0}
.vprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vprow>input[type=range]{flex:1 1 120px;min-width:80px}
.vpgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px}
#vizbar input[type=range]{min-width:0;width:100%}
#vizbar .vprow label input[type=range]{width:90px}
@media (max-width:600px){#vizbar{position:static;width:auto;max-width:none;margin-bottom:8px}.vpgrid{grid-template-columns:minmax(0,1fr)}}
#vizbar label{display:inline-flex;align-items:center;gap:6px;line-height:1.2}
#vizbar .vpgrid label{justify-content:space-between}
#vizbar input{margin:0}
#vizbar input[type=range]{accent-color:var(--hot)}
#vizbar #count{min-width:3.5em;text-align:center;white-space:nowrap}
#vizbar select{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:110px}
#vizbar button{padding:4px 8px}
#viewer:fullscreen #stagewrap,#viewer.maxed #stagewrap{flex:1 1 auto;min-height:0;display:flex;margin:0}
#viewer:fullscreen #stagewrap #stage,#viewer.maxed #stagewrap #stage{flex:1 1 auto;width:100%}
.k-response{stroke-dasharray:6 4}
.k-async,.k-event{stroke-dasharray:2 4;stroke-linecap:round}
.edge.done{stroke:var(--done);opacity:.75}
.edge.active{stroke:var(--hot);stroke-width:calc(var(--ew,1.5) * 1.8);opacity:1}
.body{fill:var(--fill);stroke:var(--stroke);stroke-width:.75;transition:stroke .2s}
.lip{fill:none;stroke:var(--stroke);stroke-width:.75}
.node.hl .body{stroke:var(--hot);stroke-width:2.5}
.node.sel .body{stroke:var(--sel);stroke-width:3.5}
.node.glow .body{animation:glow 1.1s ease-in-out infinite}
.edge.glow{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 1px var(--sel))}50%{filter:drop-shadow(0 0 9px var(--sel)) drop-shadow(0 0 4px var(--sel))}}
.edge.sel{stroke:var(--sel);stroke-width:3.5;opacity:1}
.lbl{fill:var(--title);font-size:14px;font-weight:500}
.sub{fill:var(--sub);font-size:12px}
.pkt{fill:var(--hot);stroke:var(--hot-d);stroke-width:1}
.pkt.resp{fill:var(--bg)}
#legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text2);min-height:8px}
#legend .chip{display:inline-flex;align-items:center;gap:6px}
#legend i{width:12px;height:12px;border-radius:3px;background:var(--fill);border:1px solid var(--stroke)}
#cap{margin:12px 0 0;width:100%;background:var(--card);border-radius:12px;padding:12px 16px;height:160px;overflow-y:auto}
#cap .line+.line{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
#cap .t{font-weight:500}
#cap .route{color:var(--text2);font-size:13px;margin-left:6px}
#cap .d{color:var(--text2);margin-top:2px}
#cap code{display:inline-block;margin-top:4px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
#scrub{flex:1 1 200px;min-width:120px}
#spd{width:90px}
#steps{list-style:none;counter-reset:s;margin:14px 0 0;padding:0;width:100%}
#steps li{counter-increment:s;display:flex;gap:10px;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);border-left:3px solid transparent}
#steps li::before{content:counter(s);min-width:18px;text-align:right;color:var(--text2)}
#steps li.par::before{content:"+"}
#steps li:hover{background:var(--card)}
#steps li.past{color:var(--text)}
#steps li.active{background:var(--card);color:var(--text);border-left-color:var(--hot);font-weight:500}
#drop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:20px;z-index:10}
#drop[hidden]{display:none}
dialog{width:min(640px,92vw);border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;height:260px;font:12px ui-monospace,Menlo,Consolas,monospace;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
#layout{display:block}
#editor{margin:16px 0 0;border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow:auto;font-size:13px}
#editor[hidden]{display:none}
#viewer{min-width:0}
#viewer:fullscreen,#viewer.maxed{background:var(--bg);display:flex;flex-direction:column;padding:16px 24px;overflow:auto}
#viewer.maxed{position:fixed;inset:0;z-index:5}
body.maxed{overflow:hidden}
#viewer:fullscreen #stage,#viewer.maxed #stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:safe center;margin:0}
#viewer:fullscreen #svg,#viewer.maxed #svg{flex:none}
#viewer:fullscreen #steps,#viewer.maxed #steps{display:none}
#viewer:fullscreen #cap,#viewer.maxed #cap{width:100%;flex:none}
@media (min-width:960px){
  body.editing #layout{display:grid;grid-template-columns:minmax(420px,560px) minmax(0,1fr);gap:24px;align-items:start}
  body.editing #editor{position:sticky;top:12px;max-height:calc(100vh - 24px)}
}
@media (max-width:959px){#editor{max-height:50vh}}
.ebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:-10px;background:var(--bg);padding:6px 0;z-index:1}
.edirty{color:var(--warn);font-size:12px}
.esec{margin:12px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.esec summary{cursor:pointer;font-weight:600;font-size:14px;margin:0;padding:8px 10px;background:var(--card);display:flex;align-items:center;gap:8px}
.esec[open]>summary{border-bottom:1px solid var(--line)}
.esec summary .ecount{font-size:11px;font-weight:500;color:var(--text2);border:1px solid var(--line);border-radius:10px;padding:0 7px}
.esec>.ebody{padding:0 10px 10px}
.ebody{display:flex;flex-direction:column;width:100%}
.eitem{border-top:1px solid var(--line)}
.eitem>summary{cursor:pointer;padding:7px 10px;border-radius:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eitem>.erow{border-top:0;padding:2px 10px 10px}
.eitem>summary:hover{background:var(--card)}
.eitem[open]>summary{font-weight:600}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.esec>summary::after,.eitem>summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:rotate(45deg);flex:none;transition:transform .15s}
.esec>summary::after{margin-left:auto;margin-bottom:3px}
.eitem>summary{position:relative;padding-right:30px}
.eitem>summary::after{position:absolute;right:12px;top:calc(50% - 6px)}
.esec[open]>summary::after,.eitem[open]>summary::after{transform:rotate(-135deg)}
.esec[open]>summary::after{margin-bottom:-3px}
.eitem[open]>summary::after{top:calc(50% - 2px)}
.erow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px 8px;align-items:end;padding:8px 0;border-top:1px solid var(--line);width:100%}
.erow>.ef{grid-column:span 4}
.erow>button{grid-column:span 2;justify-self:stretch;height:28px;padding:0 6px}
.erow>.eid{grid-column:span 4;align-self:center;overflow:hidden;text-overflow:ellipsis;font:12px ui-monospace,Menlo,Consolas,monospace}
.emodes{display:flex;gap:0;margin:8px 0 2px}
.emodes button{border-radius:0;padding:3px 12px;font-size:12px}
.emodes button:first-child{border-radius:8px 0 0 8px}
.emodes button:last-child{border-radius:0 8px 8px 0;border-left:0}
.emodes button[aria-pressed=true]{background:var(--card);border-color:var(--hot);font-weight:600}
.esentence{grid-column:span 11;align-self:center;font-size:13px;line-height:2;color:var(--text)}
.elink{font:inherit;color:var(--sel);background:transparent;border:0;border-bottom:1px solid currentColor;border-radius:0;padding:0 1px;cursor:pointer}
.elink:hover{background:var(--card)}
.elink.empty{color:var(--text2);font-style:italic}
.elinkin{font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--sel);border-radius:4px;padding:1px 4px;max-width:100%}
.eadd{margin-top:10px;padding-top:10px;border-top:2px solid var(--line)}
.eaddbtn{width:100%;height:30px;border:1px dashed var(--text2);border-radius:6px;background:transparent;color:var(--text);cursor:pointer;font-weight:500}
.eaddbtn:hover:not(:disabled){background:var(--card)}
.eaddbtn:disabled{opacity:.5;cursor:default}
.ef{display:flex;flex-direction:column;font-size:11px;color:var(--text2);min-width:0}
.ef input[type=text],.ef select{width:100%;min-width:0;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px;height:28px}
.ef.echk{flex-direction:row;align-items:center;gap:6px;height:28px}
.enum{padding:0}
#editBtn[aria-pressed=true]{background:var(--card);border-color:var(--hot)}
#note{margin:2px 0 0;font-size:12px;color:var(--text2);min-height:1em}
.menu{position:relative;display:inline-block}
.menupop{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:260px;max-width:340px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.menupop[hidden]{display:none}
.menupop button{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menupop button:disabled{opacity:.45;cursor:not-allowed}
.menupop button.cur{background:var(--card);box-shadow:inset 3px 0 var(--hot)}
.menupop .mh{font-size:11px;color:var(--text2);padding:4px 10px 2px;text-transform:uppercase;letter-spacing:.04em}
.menupop .ms{height:1px;background:var(--line);margin:6px 0}
.menupop .ml{max-height:180px;overflow-y:auto}
#mcpDlg{max-width:640px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:0}
#mcpDlg::backdrop{background:rgba(0,0,0,.4)}
.mcpbox{padding:16px 20px}
.mcpbox h2{margin:0 0 4px;font-size:18px;font-weight:500}
.mcpbox p{margin:4px 0 10px;color:var(--text2);font-size:13px}
.mcptabs{display:flex;gap:6px;margin-bottom:10px}
.mcptabs button[aria-pressed=true]{background:var(--card);border-color:var(--hot)}
.mcprow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--text2);margin-bottom:8px}
.mcprow input{flex:1;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.mcphead{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.mcpbox pre{margin:4px 0 8px;padding:10px;background:var(--card);border-radius:8px;font:12px ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.edge,.body{transition:none}.node.glow .body,.edge.glow{animation:none;filter:drop-shadow(0 0 6px var(--sel))}}
</style>
<style id="pal"></style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="title">Flow animator</h1>
      <p id="desc"></p>
      <p id="src"></p>
      <p id="note" role="status" aria-live="polite"></p>
    </div>
    <div class="tools">
      <span id="menuHost"></span>
      <button id="editBtn" type="button" aria-pressed="false">Edit</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <section id="issues" hidden aria-live="polite"></section>

  <div id="layout">
    <section id="editor" hidden aria-label="Editor"></section>
    <div id="viewer">
    <div id="stagewrap">
      <div id="vizbar" role="group" aria-label="View panel">
        <div id="vphead"><span>View</span><button id="vpToggle" type="button" aria-expanded="true" title="Hide or show the view panel">Hide</button></div>
        <div id="vpbody">
          <div class="vprow" aria-label="Playback">
            <button id="restart" type="button">Restart</button>
            <button id="prev" type="button">Prev</button>
            <button id="play" type="button">Pause</button>
            <button id="next" type="button">Next</button>
          </div>
          <div class="vprow">
            <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
            <span id="count">1 / 1</span>
          </div>
          <div class="vprow">
            <label>Speed <input id="spd" type="range" min="0.5" max="3" step="0.5" value="1"> <span id="spdl">1x</span></label>
            <label><input id="loop" type="checkbox" checked> Loop</label>
            <label><input id="trail" type="checkbox" checked> Trail</label>
          </div>
          <div class="vprow vpgrid">
            <label>Orientation <select id="optDir"><option value="LR">Horizontal</option><option value="TB">Vertical</option></select></label>
            <label>Connections <select id="optConn"><option value="auto">Auto</option><option value="bezier">Bezier</option><option value="linear">Linear</option><option value="orthogonal">Orthogonal</option></select></label>
            <label>Step style <select id="optStep"><option value="kind">By kind</option><option value="solid">Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select></label>
            <label>Thickness <input id="optThick" type="range" min="1" max="6" step="0.5" value="1.5" aria-label="Line thickness"> <span id="optThickL">1.5</span></label>
          </div>
          <div class="vprow">
            <button id="zin" type="button" title="Zoom in" aria-label="Zoom in">+</button>
            <button id="zout" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
            <button id="zreset" type="button" title="Reset zoom and position">Reset</button>
            <button id="maxBtn" type="button" aria-pressed="false" title="Maximize the visualization (M)">Maximize</button>
            <button id="fsBtn" type="button" aria-pressed="false" title="Fullscreen (F)">Fullscreen</button>
          </div>
        </div>
      </div>
      <section id="stage"><svg id="svg" role="img" aria-label="Animated flow diagram"></svg></section>
    </div>
    <div id="legend"></div>

    <section id="cap" aria-live="polite"></section>

    <ol id="steps"></ol>
    </div>
  </div>
</div>

<div id="drop" hidden>Drop a .flow.json file to animate it</div>

<dialog id="dlg">
  <form method="dialog">
    <label for="ta" class="sr">Flow JSON</label>
    <textarea id="ta" spellcheck="false" placeholder='{ "format": "flow-animator/1", "nodes": [ ... ], "steps": [ ... ] }'></textarea>
    <div class="row">
      <button value="cancel">Cancel</button>
      <button id="renderBtn" value="ok">Render</button>
    </div>
  </form>
</dialog>

<noscript>This tool needs JavaScript.</noscript>

<script src="flow-core.js"></script>
<script src="src/flow-library/apply-edit/apply-edit.js"></script>
<script src="src/playback/edit-flow/edit-flow.js"></script>
<script src="src/playback/flow-gateway/flow-gateway.js"></script>
<script src="src/playback/save-flow/save-flow.js"></script>
<script src="src/playback/mcp-config/mcp-config.js"></script>
<script src="src/playback/export-flow/export-flow.js"></script>
<script src="src/playback/record-video/record-video.js"></script>
<script src="src/playback/flow-menu/flow-menu.js"></script>
<script id="sample-flow" type="application/json">{
  "$schema": "../flow.schema.json",
  "format": "flow-animator/1",
  "title": "Order submission",
  "description": "A client submits an order. The service stores it and hands the slow work to a background worker.",
  "groups": [
    { "id": "client", "label": "Client", "color": "gray" },
    { "id": "sync", "label": "Request path", "color": "purple" },
    { "id": "async", "label": "Background processing", "color": "teal" },
    { "id": "external", "label": "External", "color": "coral" }
  ],
  "nodes": [
    { "id": "client", "label": "Client", "subtitle": "WPF app", "group": "client" },
    { "id": "api", "label": "API gateway", "subtitle": "Auth, routing", "group": "sync" },
    { "id": "orders", "label": "Order service", "subtitle": "Business logic", "group": "sync" },
    { "id": "db", "label": "Database", "subtitle": "Orders table", "shape": "database", "group": "client", "col": 3, "row": 0 },
    { "id": "queue", "label": "Message queue", "subtitle": "OrderCreated events", "shape": "queue", "group": "async", "col": 3, "row": 1 },
    { "id": "worker", "label": "Worker", "subtitle": "Background jobs", "group": "async", "col": 4, "row": 1 },
    { "id": "mail", "label": "Email provider", "subtitle": "SMTP relay", "group": "external", "col": 4, "row": 0 }
  ],
  "steps": [
    { "from": "client", "to": "api", "label": "Submit order", "detail": "The user presses Submit; the client sends the order over HTTPS.", "payload": "POST /orders" },
    { "from": "api", "to": "orders", "label": "Forward request", "detail": "The gateway validates the token and routes the call to the order service." },
    { "from": "orders", "to": "db", "label": "Persist order", "detail": "The order is saved with status 'received'.", "payload": "INSERT INTO orders" },
    { "from": "orders", "to": "queue", "label": "Publish event", "kind": "async", "detail": "Slow work is deferred: an OrderCreated event is queued.", "payload": "OrderCreated { id }" },
    { "from": "orders", "to": "api", "label": "Return result", "kind": "response", "detail": "The service answers without waiting for the worker.", "payload": "201 Created" },
    { "from": "api", "to": "client", "label": "Confirm to user", "kind": "response", "detail": "The client shows the confirmation." },
    { "from": "queue", "to": "worker", "label": "Deliver event", "kind": "async", "detail": "The worker picks up the event from the queue." },
    { "from": "worker", "to": "db", "label": "Update status", "detail": "Status changes to 'processing'.", "payload": "UPDATE orders" },
    { "from": "worker", "to": "mail", "label": "Send confirmation email", "kind": "async", "together": true, "detail": "Runs in parallel with the status update." }
  ]
}</script>
<script>
(function () {
  'use strict';
  var C = window.FlowCore;
  var NS = 'http://www.w3.org/2000/svg';

  /* palette: [light fill, light stroke, light title, dark stroke, dark title]; dark fill = light title */
  var PAL = {
    gray:   ['#F1EFE8', '#5F5E5A', '#444441', '#B4B2A9', '#D3D1C7'],

  function applyView() {

  /* Editor selection: nodes/edges of expanded or focused editor items. */

  /* Record the animation once, from the first step, as a video file (slice record-video). */
  var recording = null;
  function recordVideo() {

        });
      },
      prepare: function () {

      loadLocal(NEW_FLOW, 'new flow');
      if (editor && !editor.isActive()) $('editBtn').click();
      notify(S.apiUp ? 'New flow. Use Save as to store it.' : 'New flow. Use Download to keep it.');
    },
    share: function () {
      var n = saver.name(); if (!n) return;
      var link = location.origin + location.pathname + '?flow=' + encodeURIComponent(n);
      copyText(link).then(function (ok) { if (ok) notify('Link copied: ' + link); else window.prompt('Copy this link:', link); });
    },
    remove: deleteStored,
    exportJson: function () {
      if (!S.text) return;
      window.ExportFlow.download(document, exportName('json'), 'application/json', S.text);
    },
    exportHtml: function () {
      if (!S.text) return;
      window.ExportFlow.fetchStandalone(fetch.bind(window), location.href, S.text).then(function (html) {
        window.ExportFlow.download(document, exportName('html'), 'text/html', html);
      }).catch(function (e) {
        notify('Could not build the standalone HTML: ' + (e && e.message ? e.message : e) + (location.protocol === 'file:' ? ' (serve the viewer over http, or use build-standalone.js)' : ''));
      });
    },
    canRecordVideo: function () { return !!window.RecordVideo.supported(window); },
    exportVideo: recordVideo,
    mcp: function () { mcpDialog.open(); }
  });

  function openStored(name) {
    name = String(name).replace(/\.flow\.json$/i, ''); // older links carry the suffix
    return gateway.load(name).then(function (r) {
      if (!r.ok && r.kind === 'unauthorized') {
        var t = window.prompt('This server needs an access token:');
        if (t) { setToken(t); return openStored(name); }
      }
      if (!r.ok) { notify('Could not open ' + name + ': ' + (r.message || r.kind)); picker.select(saver.name()); return r; }
      var res = loadText(r.text, name);
      if (res.ok) { saver.setSource(name, r.revision); picker.select(name); $('src').textContent = srcLabel() || ('Source: ' + name); }
      return r;
    });
  }

  /* Loads that do not come from the Flow Library: forget the stored name. */
  function loadLocal(text, name) { saver.clearSource(); picker.select(null); return loadText(text, name); }

  /* ---------- loading ---------- */

  function showIssues(errors, warnings, name, kept) {
    var box = $('issues');
    box.textContent = '';
    if (!errors.length && !warnings.length) { box.hidden = true; return; }
    box.hidden = false;
    box.className = errors.length ? 'bad' : 'warn';
    var head;
    if (errors.length) {
      head = 'Could not load ' + name + ': ' + errors.length + ' error' + (errors.length > 1 ? 's' : '') +
        (warnings.length ? ' and ' + warnings.length + ' warning' + (warnings.length > 1 ? 's' : '') : '') +
        (kept ? ' (still showing the previous diagram)' : '');
    } else {
      head = name + ' loaded with ' + warnings.length + ' warning' + (warnings.length > 1 ? 's' : '');
    }
    h('div', 'ihead', head, box);
    var ul = h('ul', null, null, box);
    errors.concat(warnings).forEach(function (it) {
      var li = h('li', null, null, ul);
      h('code', null, it.path, li);
      li.appendChild(document.createTextNode(it.message));
    });
  }

  function loadText(text, name) {
    var res = C.load(text);
    name = name || 'input';
    if (!res.ok) {
      showIssues(res.errors, res.warnings, name, !!S.model);
      return res;
    }
    S.name = name; S.text = text;
    S.model = res.model;
    var lo = layoutOpts(res.model);
    S.geo = (lo.direction !== res.model.direction || lo.connection !== res.model.connection) ? C.layout(res.model, lo) : res.geometry;
    syncOpts(res.model);
    render(res.model, S.geo);
    $('src').textContent = (saver.name() === name && srcLabel()) || ('Source: ' + name);
    showIssues([], res.warnings, name, false);
    S.finished = false;
    S.playing = !S.reduced; // a freshly loaded flow starts playing
    begin(0);
    if (editor) editor.onLoaded(text);
    return res;
  }

  function loadFromUrl(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  }

  function fetchFailed(src, e) {
    var msg = 'Could not fetch ' + src + ': ' + (e && e.message ? e.message : e) + '.';
    if (location.protocol === 'file:') {
      msg += ' Browsers block fetch() on file:// pages. Serve this folder (python3 -m http.server) or use "Open file..." instead.';
    }
    showIssues([{ path: 'src', message: msg + ' Showing the built-in example instead.' }], [], src, false);
  }

  /* ---------- wiring ---------- */

  $('play').addEventListener('click', togglePlay);
  $('next').addEventListener('click', function () { jump(S.idx + 1, true); });
  $('prev').addEventListener('click', function () { jump(S.idx - 1, true); });
  $('restart').addEventListener('click', function () { jump(0, false); });
  $('scrub').addEventListener('input', function (e) { S.playing = false; jump(+e.target.value, true); });
  $('spd').addEventListener('input', function (e) { S.speed = parseFloat(e.target.value); $('spdl').textContent = S.speed + 'x'; });
  $('trail').addEventListener('change', function () { if (S.model) paint(); });

  if (editor) {
    editor.mount($('editor'));
    $('editBtn').addEventListener('click', function () {
      var on = editor.setActive(!editor.isActive());
      $('editBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
      document.body.classList.toggle('editing', on);
    });
    window.addEventListener('beforeunload', function (e) { if (editor.isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  } else $('editBtn').hidden = true;

  $('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function (t) { loadLocal(t, f.name); });
    e.target.value = '';
  });
  $('dlg').addEventListener('close', function () {
    if ($('dlg').returnValue === 'ok' && $('ta').value.trim()) loadLocal($('ta').value, 'pasted JSON');
  });

  window.addEventListener('dragenter', function (e) { e.preventDefault(); $('drop').hidden = false; });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  $('drop').addEventListener('dragleave', function () { $('drop').hidden = true; });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); $('drop').hidden = true;
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (f && discardOk()) f.text().then(function (t) { loadLocal(t, f.name); });
  });

  /* ---------- rendering options and maximize ---------- */

  var V = { direction: null, connection: null, step: 'kind', thick: 1.5 };
  var VP_KEY = 'flow-animator.viewpanel';
  function setPanel(collapsed) {
    $('vizbar').classList.toggle('collapsed', collapsed);
    $('vpToggle').textContent = collapsed ? 'Show' : 'Hide';
    $('vpToggle').setAttribute('aria-expanded', String(!collapsed));
    try { localStorage.setItem(VP_KEY, collapsed ? '1' : '0'); } catch (e) {}
  }
  $('vpToggle').addEventListener('click', function () { setPanel(!$('vizbar').classList.contains('collapsed')); });
  try { if (localStorage.getItem(VP_KEY) === '1') setPanel(true); } catch (e) {}
  function zoomBy(f) {
    if (!S.vp) return;
    var vb = $('svg').viewBox.baseVal, cx = vb.width / 2, cy = vb.height / 2, v = S.view, k = Math.min(8, Math.max(0.2, v.k * f));
    v.x = cx - (cx - v.x) * k / v.k; v.y = cy - (cy - v.y) * k / v.k; v.k = k; applyView();
  }
  $('zin').addEventListener('click', function () { zoomBy(1.25); });
  $('zout').addEventListener('click', function () { zoomBy(0.8); });
  $('zreset').addEventListener('click', function () { S.view = { k: 1, x: 0, y: 0 }; applyView(); });
  try {
    var saved = JSON.parse(localStorage.getItem('flow-animator.view') || '{}');
    if (C.CONNECTIONS.indexOf(saved.connection) >= 0) V.connection = saved.connection;
    if (['kind', 'solid', 'dashed', 'dotted'].indexOf(saved.step) >= 0) V.step = saved.step;
    if (saved.thick >= 1 && saved.thick <= 6) V.thick = +saved.thick;
  } catch (e) {}

  function saveView() {
    try { localStorage.setItem('flow-animator.view', JSON.stringify({ connection: V.connection, step: V.step, thick: V.thick })); } catch (e) {}
  }
  function layoutOpts(model) {
    return { direction: V.direction || model.direction, connection: V.connection || model.connection };
  }
  function syncOpts(model) {
    var o = layoutOpts(model);
    $('optDir').value = o.direction; $('optConn').value = o.connection;
    $('optStep').value = V.step; $('optThick').value = String(V.thick); $('optThickL').textContent = String(V.thick);
    applyLook();
  }
  function applyLook() {
    var svg = $('svg');
    svg.style.setProperty('--ew', String(V.thick));
    svg.classList.remove('ss-solid', 'ss-dashed', 'ss-dotted');
    if (V.step !== 'kind') svg.classList.add('ss-' + V.step);
  }
  function relayout() {
    if (!S.model) return;
    S.geo = C.layout(S.model, layoutOpts(S.model));
    var keep = S.arrived;
    render(S.model, S.geo);
    applyLook();
    begin(S.idx);
    if (keep) { S.elapsed = S.DUR; S.arrived = true; hidePackets(); paint(); }
  }
  $('optDir').addEventListener('change', function () { V.direction = this.value; relayout(); });
  $('optConn').addEventListener('change', function () { V.connection = this.value; saveView(); relayout(); });
  $('optStep').addEventListener('change', function () { V.step = this.value; saveView(); applyLook(); });
  $('optThick').addEventListener('input', function () {
    V.thick = +this.value; $('optThickL').textContent = String(V.thick); saveView(); applyLook();
    Object.keys(S.edgeEls).forEach(function (id) { S.lens[id] = S.edgeEls[id].getTotalLength(); });
  });

  function setMaxed(on) {
    $('viewer').classList.toggle('maxed', on);
    document.body.classList.toggle('maxed', on);
    $('maxBtn').setAttribute('aria-pressed', String(on));
    $('maxBtn').textContent = on ? 'Minimize' : 'Maximize';
    if (S.model) paint();
  }
  $('maxBtn').addEventListener('click', function () { setMaxed(!$('viewer').classList.contains('maxed')); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('viewer').classList.contains('maxed') && !document.fullscreenElement) setMaxed(false);
  });

  function toggleFullscreen() {
    if (document.fullscreenElement) return document.exitFullscreen();
    var v = $('viewer');
    if (v.requestFullscreen) v.requestFullscreen().catch(function () {});
  }
  $('fsBtn').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', function () {
    var on = !!document.fullscreenElement;
    $('fsBtn').setAttribute('aria-pressed', String(on));
    $('fsBtn').textContent = on ? 'Exit fullscreen' : 'Fullscreen';
  });

  window.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'LI') return;
    if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFullscreen();
    else if ((e.key === 'm' || e.key === 'M') && !e.ctrlKey && !e.metaKey && !e.altKey) setMaxed(!$('viewer').classList.contains('maxed'));
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') jump(S.idx + 1, true);
    else if (e.key === 'ArrowLeft') jump(S.idx - 1, true);
    else if (e.key === 'Home') jump(0, false);
  });

  // public API for scripts, tests and agents driving a browser
  window.FlowAnimator = {
    load: function (input) {
      return loadLocal(typeof input === 'string' ? input : JSON.stringify(input), 'API call');
    },
    validate: function (input) {
      var p = typeof input === 'string' ? C.parse(input) : { doc: input, errors: [] };
      return p.errors.length ? { errors: p.errors, warnings: [] } : C.validate(p.doc);
    },
    state: function () {
      return { title: S.model && S.model.title, beat: S.idx, beats: S.model && S.model.beats.length, playing: S.playing, arrived: S.arrived };
    },
    edit: function (op, args) { return editor ? editor.edit(op, args) : { ok: false, errors: [{ path: '', message: 'editor not available' }] }; },
    jump: jump
  };

  /* ---------- start ---------- */

  var params = new URLSearchParams(location.search);
  var src = params.get('src');
  var embedded = $('flow-data');
  requestAnimationFrame(frame);

  picker.mount($('menuHost'));
  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S') && editor && editor.isActive() && S.apiUp) {
      e.preventDefault(); saver.save();
    }
  });
  function watchStored(name, rev) {
    setInterval(function () {
      if (saver.name() !== name || (editor && editor.isDirty())) return;
      gateway.load(name, { ifNoneMatch: saver.revision() }).then(function (r) {
        if (r.ok && !r.notModified && r.text) { loadText(r.text, name); saver.setSource(name, r.revision); $('src').textContent = srcLabel() || ('Source: ' + name); }
      }).catch(function () {});
    }, 1500);
  }
  var SESSION_KEY = 'flow-animator.session';
  function readSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
  function saveSession() {
    try {
      var n = saver.name();
      if (!n || !S.model) { sessionStorage.removeItem(SESSION_KEY); return; }
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ flow: n, idx: S.idx, playing: S.playing, x: window.scrollX, y: window.scrollY, sx: $('stage').scrollLeft }));
    } catch (e) {}
  }
  function restoreSession(name) {
    var s = readSession();
    if (!s || s.flow !== name || !S.model) return;
    S.playing = !!s.playing && !S.reduced;
    jump(s.idx || 0, !S.playing);
    requestAnimationFrame(function () { $('stage').scrollLeft = s.sx || 0; window.scrollTo(s.x || 0, s.y || 0); });
  }
  window.addEventListener('pagehide', saveSession);
  var saved = !src && !embedded ? readSession() : null;
  var flowParam = params.get('flow') || (saved && saved.flow);
  gateway.available().then(function (up) {
    S.apiUp = up; picker.setApi(up);
    if (editor) editor.refresh();
    return picker.refresh();
  }).then(function () {
    if (flowParam) {
      return openStored(flowParam).then(function (r) {
        if (!r.ok) { loadLocal($('sample-flow').textContent, 'built-in example'); return; }
        restoreSession(flowParam.replace(/\.flow\.json$/i, ''));
        if (params.get('watch')) watchStored(flowParam);
      });
    }
  });

  if (flowParam) {
    // handled above once the gateway knows whether the API exists
  } else if (src) {
    loadFromUrl(src).then(function (t) {
      var last = t;
      loadLocal(t, src);
      if (params.get('watch')) {
        setInterval(function () {
          loadFromUrl(src).then(function (nt) { if (nt !== last && !(editor && editor.isDirty())) { last = nt; loadText(nt, src); } }).catch(function () {});
        }, 1500);
      }
    }).catch(function (e) { loadLocal($('sample-flow').textContent, 'built-in example'); fetchFailed(src, e); });
  } else if (embedded) {
    loadLocal(embedded.textContent, 'embedded flow');
  } else {
    loadLocal($('sample-flow').textContent, 'built-in example');
  }
})();
</script>
</body>
</html>
